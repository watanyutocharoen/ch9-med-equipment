<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตรวจสอบสถานะสั่งซื้อ - CH9 Airport Hospital</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600&family=Sarabun:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* reset */
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: one shell, two modes. Department tracker = parcel-app style vertical step timeline; purchasing desk = login, pipeline tiles, order rows, logs. */
:root{
  /* Theme: white ground, hospital blue as the main colour, red only for "current step" and danger. Single light look by design. */
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#EDF1F9; --ink:#10204A; --muted:#55627F; --line:#D6DDEC;
  --brand:#1C3F94; --brand-ink:#FFFFFF; --brand-soft:#E4EBFA;
  --warn:#C8202F; --warn-soft:#FDE6E8;
  --ok:#143080; --ok-soft:#DCE5F9;
  --bad:#B3001B; --bad-soft:#FDE6E8;
  --f-display:'Prompt','Sarabun',system-ui,sans-serif;
  --f-body:'Sarabun',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:980px;margin:0 auto}

/* header */
.top{position:relative;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:18px 0 16px;margin-bottom:6px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--brand) 0 80%,var(--warn) 80% 100%)}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.logo{display:block;height:60px;width:auto;max-width:100%;flex:none}
.brand{flex-wrap:wrap;gap:8px 16px}
.brand h1{padding-left:16px;border-left:3px solid var(--warn)}
.brand h1{font-size:19px;color:var(--brand)}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px;max-width:100%}
.seg button{border:0;background:transparent;padding:8px 12px;min-width:0;border-radius:8px;cursor:pointer;font-weight:500;color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* generic */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:34px;padding:4px 10px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--brand);cursor:pointer;padding:6px 0;font-weight:500}
.inp{width:100%;min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}
.inp::placeholder{color:var(--muted)}
select.inp{padding-right:8px}
.fld{display:grid;gap:6px;margin-bottom:14px}
.fld>span,.fld>label{font-weight:500;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:14px;min-height:20px}
.eyebrow{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.brand{background:var(--brand-soft);color:var(--brand)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:600;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

/* combobox */
.combo{position:relative}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 4px);max-height:260px;overflow:auto;margin:0;padding:4px;list-style:none;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.18);z-index:40}
.combo-list li{padding:9px 12px;border-radius:7px;cursor:pointer}
.combo-list li.act,.combo-list li:hover{background:var(--brand-soft)}
.combo-list li.sel{font-weight:600;color:var(--brand)}
.combo-list li.empty{padding:12px;cursor:default;color:var(--muted);text-align:left}
.combo-list li.empty:hover{background:none}

/* department tracker */
.hero{padding:22px 0 18px;display:grid;gap:14px}
.hero h2{font-size:clamp(24px,5vw,34px)}
.hero p{color:var(--muted);max-width:60ch}
.pick{max-width:560px}
.pick .inp{min-height:50px;font-size:17px}
.legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;counter-reset:s}
.legend li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.legend li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font:600 13px var(--f-mono)}
.legend small{display:block;color:var(--muted);font-size:13px}
.sumline{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:20px 0 12px}
.sumline h3{font-size:20px}
.tools{display:grid;grid-template-columns:1fr minmax(0,260px);gap:10px;margin-bottom:14px}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.oc-top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.ono{font-size:14px;color:var(--muted)}
.oc-item{font-size:18px;overflow-wrap:anywhere}
.oc-meta{font-size:14px;color:var(--muted)}
.track{display:grid;grid-template-columns:repeat(7,1fr);padding:2px 0}
.tk{position:relative;display:grid;justify-items:center;align-content:center;height:32px}
.tk::after{content:"";position:absolute;top:50%;left:50%;width:100%;height:4px;margin-top:-2px;background:var(--surface2);border-radius:2px}
.tk:last-child::after{display:none}
.tk.done::after{background:var(--brand)}
.tk.cur::after{background:linear-gradient(90deg,var(--warn),var(--surface2))}
.tk .n{position:relative;z-index:1;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);color:var(--muted);font:600 11.5px var(--f-mono)}
.tk.done .n{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tk.cur .n{background:var(--warn);border-color:var(--warn);color:var(--surface);width:32px;height:32px;font-size:13.5px;animation:pulse 2s infinite}
.track.all .tk .n{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.track.all .tk::after{background:var(--ok)}
.now{display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--warn-soft)}
.now.ok{background:var(--ok-soft)}
.nico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--warn);color:var(--surface)}
.now.ok .nico{background:var(--ok)}
.nico svg{width:26px;height:26px}
.now small{display:block;font-size:12.5px;color:var(--muted);line-height:1.3}
.now b{display:block;font-family:var(--f-display);font-weight:600;font-size:16.5px;line-height:1.3;overflow-wrap:anywhere}
.now .since{font-size:13px;color:var(--muted)}
.nextline{font-size:13.5px;color:var(--muted)}
.steps{list-style:none;margin:4px 0 0;padding:16px 0 0;border-top:1px solid var(--line)}
.step{display:grid;grid-template-columns:40px 1fr;gap:14px;position:relative;padding:0 0 16px}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:18.5px;top:40px;bottom:0;width:3px;border-radius:2px;background:var(--surface2)}
.step:last-child::before{display:none}
.step.done::before{background:var(--brand)}
.dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface);color:var(--muted);z-index:1}
.dot svg{width:20px;height:20px}
.step.done .dot{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.step.cur .dot{background:var(--warn);border-color:var(--warn);color:var(--surface);animation:pulse 2s infinite}
.step .body{padding-top:6px;min-width:0}
.step .t{font-weight:500}
.step.todo .t{color:var(--muted)}
.step.cur .t{font-weight:600;font-size:16px}
.step small{display:block;color:var(--muted);font-size:13px}
.step .tag{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:0 8px;margin-left:4px;background:var(--warn-soft);color:var(--warn);vertical-align:2px}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--warn) 50%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.tk.cur .n,.step.cur .dot{animation:none}}

/* purchasing desk */
.login{max-width:420px;margin:28px auto 0}
.login h2{font-size:24px;margin-bottom:4px}
.pwrow{position:relative}
.pwrow button{position:absolute;right:4px;top:4px;height:34px}
.deskbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:14px 0}
.deskbar h2{font-size:21px}
.deskbar .who{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-weight:500}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.pipe{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.tile{flex:1 0 92px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;text-align:left;cursor:pointer;display:grid;gap:0}
.tile .tn{font:600 22px var(--f-display);line-height:1.2}
.tile .tl{font-size:12.5px;color:var(--muted);white-space:nowrap}
.tile[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.toolbar{display:grid;grid-template-columns:minmax(0,1fr) 200px auto;gap:10px;margin-bottom:14px}
.orow{display:grid;grid-template-columns:120px minmax(0,1fr) 100px 220px auto;grid-template-areas:"no item qty st act" "dept dept dept upd upd";gap:6px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.orow .o-no{grid-area:no;font-size:14px}
.orow .o-item{grid-area:item;min-width:0;overflow-wrap:anywhere}
.orow .o-item b{display:block;font-weight:600}
.orow .o-item span{font-size:13.5px;color:var(--muted)}
.orow .o-qty{grid-area:qty;font-variant-numeric:tabular-nums}
.orow .o-st{grid-area:st}
.orow .o-st select{min-height:38px;font-size:14px}
.orow .o-act{grid-area:act;display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.orow .o-upd{grid-area:upd;font-size:12.5px;color:var(--muted);text-align:right}
.orow .o-dept{grid-area:dept}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.confirm span{font-size:13.5px;color:var(--bad);font-weight:500}
.lrow{display:grid;grid-template-columns:140px 150px 1fr;gap:4px 14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.lrow .who{color:var(--muted)}
.lrow .what{min-width:0;overflow-wrap:anywhere}
.lrow .what small{display:block;color:var(--muted);font-size:13px}
.lbl{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:6px;margin-right:6px;background:var(--surface2)}
.lbl.create{background:var(--ok-soft);color:var(--ok)}
.lbl.delete{background:var(--bad-soft);color:var(--bad)}
.lbl.update,.lbl.status{background:var(--warn-soft);color:var(--warn)}
.lbl.password{background:var(--brand-soft);color:var(--brand)}
.listrow{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.listrow .nm{min-width:0;overflow-wrap:anywhere;flex:1 1 200px}
.addform{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr)) auto;gap:10px;margin-bottom:16px;align-items:end}

/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(8,22,25,.58);display:grid;place-items:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:min(520px,100%);max-height:100%;overflow:auto;padding:22px}
.modal h2{font-size:20px;margin-bottom:6px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
#toasts{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:8px;pointer-events:none;z-index:60;padding:0 16px}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:100%}
.toast.bad{background:var(--bad);color:#fff}
.notice{background:var(--surface2);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px}

@media (max-width:760px){
  .tools{grid-template-columns:1fr}
  .toolbar{grid-template-columns:1fr}
  .orow{grid-template-columns:1fr auto;grid-template-areas:"no no" "item item" "dept qty" "st st" "act act" "upd upd"}
  .orow .o-act,.confirm{justify-content:flex-start}
  .orow .o-upd{text-align:left}
  .orow .o-qty{text-align:right}
  .lrow{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
}


/* dashboard */
.dhead{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:end;justify-content:space-between;margin:22px 0 14px}
.dhead h2{font-size:clamp(24px,5vw,34px)}
.dhead p{color:var(--muted)}
.dctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dctl .inp{width:auto;min-width:128px}
.dctl .inp[disabled]{opacity:.45}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .kn{font:600 28px/1.25 var(--f-display);font-variant-numeric:tabular-nums}
.kpi .kl{font-size:13.5px;color:var(--muted)}
.kpi small{display:block;font-size:12.5px;color:var(--muted)}
.kpi.hi .kn{color:var(--brand)}
.kpi.red .kn{color:var(--warn)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:14px;margin-bottom:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;margin-bottom:14px}
.dgrid .panel{margin-bottom:0}
.panel h3{font-size:17px;margin-bottom:4px}
.panel .sub{font-size:13px;color:var(--muted);margin-bottom:10px}
.hbar{display:grid;grid-template-columns:minmax(104px,180px) minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:5px 0}
.hbar .nm{font-size:14px;min-width:0;overflow-wrap:anywhere}
.hbar .tr{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden}
.hbar .fl{height:100%;background:var(--brand);border-radius:6px}
.hbar.fin .fl{background:var(--ok)}
.hbar .vl{font:500 13.5px var(--f-mono);white-space:nowrap;text-align:right}
.hbar .vl i{font-style:normal;color:var(--muted)}
.mtx-wrap{overflow-x:auto}
table.mtx{border-collapse:collapse;width:100%;min-width:700px;font-size:14px;font-variant-numeric:tabular-nums}
.mtx th,.mtx td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line)}
.mtx th:first-child,.mtx td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);min-width:150px}
.mtx thead th{font-weight:600;font-size:12.5px;color:var(--muted);vertical-align:bottom}
.mtx td.z{color:var(--line)}
.mtx td.tot{font-weight:600}
.mtx tfoot td{font-weight:600;border-top:2px solid var(--line);border-bottom:0}
.trend{display:flex;gap:6px;align-items:stretch;height:190px}
.tcol{flex:1;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:6px;min-width:0;text-align:center}
.tplot{position:relative;display:flex;align-items:flex-end;justify-content:center;padding-top:18px}
.tbar{width:100%;max-width:44px;background:var(--brand);border-radius:5px 5px 0 0;min-height:2px;position:relative}
.tbar.now{background:var(--warn)}
.tbar span{position:absolute;left:50%;transform:translateX(-50%);bottom:100%;margin-bottom:2px;font:500 12px var(--f-mono);white-space:nowrap}
.tcol small{font-size:12px;color:var(--muted);white-space:nowrap}
.late{display:grid;grid-template-columns:128px minmax(0,1fr) auto;gap:4px 12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.late:last-child{border-bottom:0}
.late .it{min-width:0;overflow-wrap:anywhere}
.late .it small{display:block;color:var(--muted);font-size:13px}
@media (max-width:560px){
  .top .seg{width:100%}
  .top .seg button{flex:1;padding:8px 4px;font-size:14px}
  .late{grid-template-columns:1fr auto}
  .late .mono{grid-column:1/-1}
  .hbar{grid-template-columns:1fr auto}
  .hbar .tr{grid-column:1/-1;order:3}
}
</style>
</head>
<body>
<div class="wrap">

function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function stepName(n){var s=STEPS[(n||1)-1];return s?s.t:'';}
function fmtDate(ts){return ts?new Date(ts).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric',timeZone:'Asia/Bangkok'}):'';}
function fmtDT(ts){return ts?new Date(ts).toLocaleString('th-TH',{day:'numeric',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Bangkok'}):'';}
function ym(){var f=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Bangkok',month:'2-digit',year:'numeric'}).formatToParts(new Date());
  function g(t){for(var i=0;i<f.length;i++)if(f[i].type===t)return f[i].value;return '';}
  return g('month')+'-'+g('year');}

function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function ssGet(k){try{return sessionStorage.getItem(k);}catch(e){return null;}}
function ssSet(k,v){try{if(v==null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v);}catch(e){}}

/* ---------- state & server calls ---------- */
var START_VIEW=(window.START_VIEW==='staff'||window.START_VIEW==='dash')?window.START_VIEW:'status';
var S={depts:[],orders:[],by:{},logs:[],users:[],ready:false,slow:false,err:'',me:null,token:null,tab:'orders'};
var view=START_VIEW,sigPub='',sigStaff='';

function api(name){
  var args=Array.prototype.slice.call(arguments,1);
  if(window.google&&google.script&&google.script.run){
    return new Promise(function(res,rej){
      var r=google.script.run.withSuccessHandler(res).withFailureHandler(function(e){rej(new Error((e&&e.message)||'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ'));});
      r[name].apply(r,args);
    });
  }
  return fetch(window.API_URL,{method:'POST',redirect:'follow',body:JSON.stringify({fn:name,args:args})})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .catch(function(e){throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ');});
}
async function act(name){
  var args=Array.prototype.slice.call(arguments,1);
  var r=await api.apply(null,[name,S.token].concat(args));
  if(r&&r.auth){expireSession();throw new Error(r.error);}
  if(!r||!r.ok)throw new Error((r&&r.error)||'ทำรายการไม่สำเร็จ');
  await refreshAll();
  return r;
}
function fail(e){console.error(e);toast((e&&e.message)||'ทำรายการไม่สำเร็จ ลองอีกครั้ง',true);}
function expireSession(){
  S.me=null;S.token=null;ssSet('ch9proc.token',null);delOrder=delDept=delUser=resetUser=null;
  toast('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่',true);
  if(view==='staff')renderStaff();
}
function byName(a,b){return String(a.name).localeCompare(String(b.name),'th');}
async function loadPublic(){
  var r=await api('getPublic');
  var sig=JSON.stringify([r.depts,r.orders]);
  S.ready=true;S.slow=false;S.err='';
  if(sig===sigPub)return;
  sigPub=sig;
  S.depts=r.depts.slice().sort(byName);S.orders=r.orders;
  onData();
}
async function loadStaff(){
  if(!S.token)return;
  var r=await api('getStaffData',S.token);
  if(r&&r.auth){expireSession();return;}
  if(!r||!r.ok)return;
  var sig=JSON.stringify([r.logs,r.by,r.users]);
  if(sig===sigStaff)return;
  sigStaff=sig;S.logs=r.logs;S.by=r.by;S.users=r.users;onData();
}
async function refreshAll(){
  await Promise.all([loadPublic(),S.token?loadStaff():Promise.resolve()]);
}
function onData(){
  if(deptCombo)deptCombo.refresh();
  refreshStatus();
  if(view==='staff'&&S.me&&$('#tabbody'))refreshDesk();
  if(view==='dash')renderDash();
}
function deptName(o){var d=S.depts.filter(function(x){return x.id===o.deptId;})[0];return d?d.name:(o.deptName||'');}

/* ---------- combobox ---------- */
function Combo(host,opt){
  host.classList.add('combo');
  host.innerHTML='<input class="inp" type="text" role="combobox" aria-expanded="false" aria-autocomplete="list" autocomplete="off" id="'+esc(opt.id)+'" placeholder="'+esc(opt.placeholder||'')+'"><ul class="combo-list" role="listbox" hidden></ul>';
  var inp=host.querySelector('input'),ul=host.querySelector('ul');
  var sel=null,active=-1,shown=[];
  function items(){return opt.items();}
  function cur(){var a=items();for(var i=0;i<a.length;i++)if(a[i].id===sel)return a[i];return null;}
  function render(){
    var q=inp.value.trim().toLowerCase(),c=cur(),all=c&&c.label===inp.value;
    shown=items().filter(function(i){return all||!q||i.label.toLowerCase().indexOf(q)>-1;});
    ul.innerHTML=shown.length?shown.map(function(i,k){return '<li role="option" data-k="'+k+'" class="'+(i.id===sel?'sel ':'')+(k===active?'act':'')+'" aria-selected="'+(i.id===sel)+'">'+esc(i.label)+'</li>';}).join('')
      :'<li class="empty">'+esc(opt.empty||'ไม่พบรายการ')+'</li>';
  }
  function open(){render();ul.hidden=false;inp.setAttribute('aria-expanded','true');}
  function close(){ul.hidden=true;inp.setAttribute('aria-expanded','false');active=-1;}
  function pick(i){sel=i.id;inp.value=i.label;close();if(opt.onPick)opt.onPick(i);}
  inp.addEventListener('focus',function(){open();try{inp.select();}catch(e){}});
  inp.addEventListener('click',open);
  inp.addEventListener('input',function(){
    if(!inp.value.trim()&&sel){sel=null;if(opt.onPick)opt.onPick(null);}
    active=-1;open();
  });
  inp.addEventListener('blur',function(){setTimeout(function(){
    close();
    var c=cur();
    if(c){inp.value=c.label;return;}
    var t=inp.value.trim().toLowerCase(),m=items().filter(function(i){return i.label.toLowerCase()===t;});
    if(m.length===1)pick(m[0]);
  },120);});
  ul.addEventListener('mousedown',function(e){var li=e.target.closest('li[data-k]');if(li){e.preventDefault();pick(shown[+li.dataset.k]);}});
  inp.addEventListener('keydown',function(e){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();if(ul.hidden)open();
      active=e.key==='ArrowDown'?Math.min(shown.length-1,active+1):Math.max(0,active-1);
      render();var a=ul.querySelector('.act');if(a)a.scrollIntoView({block:'nearest'});
    }else if(e.key==='Enter'){
      if(!ul.hidden&&active>=0&&shown[active]){e.preventDefault();pick(shown[active]);}
    }else if(e.key==='Escape'){close();}
  });
  return {
    set:function(id){sel=null;inp.value='';var a=items();for(var i=0;i<a.length;i++)if(a[i].id===id){sel=id;inp.value=a[i].label;}},
    get:function(){return sel;},
    input:inp,
    refresh:function(){var c=cur();if(c&&document.activeElement!==inp)inp.value=c.label;}
  };
}
function deptItems(){return S.depts.map(function(d){return {id:d.id,label:d.name};});}

/* ---------- modal ---------- */
function openModal(html,mount){

}
function escClose(e){if(e.key==='Escape'&&$('#ovl')&&!document.querySelector('.combo-list:not([hidden])'))closeModal();}

function deptName(o){var d=S.depts.filter(function(x){return x.id===o.deptId;})[0];return d?d.name:(o.deptName||'');}

}
function stepsHtml(o){
  var st=o.status||1,dates=o.stepDates||{};
  return '<ol class="steps">'+STEPS.map(function(s){
    var cls=s.n<st||st>=8?'done':s.n===st?'cur':'todo';
    var dt=dates[s.n]?'<small>'+(cls==='cur'?'ตั้งแต่ ':'ถึงขั้นนี้ ')+fmtDate(dates[s.n])+'</small>':'';
    return '<li class="step '+cls+'"><span class="dot">'+(cls==='done'?CHECK:ico(s.n))+'</span><div class="body"><div class="t">'+esc(s.t)+(cls==='cur'?'<span class="tag">ขั้นตอนปัจจุบัน</span>':'')+'</div>'+(s.s?'<small>'+esc(s.s)+'</small>':'')+dt+'</div></li>';
  }).join('')+'</ol>';
}
function orderCard(o){
  var st=o.status||1,del=st>=8,open=!!expanded[o.orderNo],dates=o.stepDates||{};
  var track='<div class="track'+(del?' all':'')+'" role="img" aria-label="'+(del?'ส่งมอบเรียบร้อย':'ขั้นที่ '+st+' จาก 7')+'">'+STEPS.slice(0,7).map(function(s){
    var cls=del||s.n<st?'done':s.n===st?'cur':'todo';
    return '<div class="tk '+cls+'"><span class="n">'+(cls==='done'?CHECK:s.n)+'</span></div>';}).join('')+'</div>';
  var cur=STEPS[Math.min(st,8)-1],nxt=del?null:STEPS[st];
  var since=dates[st]?(del?'เมื่อ ':'ตั้งแต่ ')+fmtDate(dates[st]):'';
  var now='<div class="now'+(del?' ok':'')+'"><span class="nico">'+ico(del?8:st)+'</span><div><small>'+(del?'สถานะ':'ขณะนี้อยู่ขั้นที่ '+st+' จาก 7')+'</small><b>'+esc(cur.t)+'</b>'+(since?'<span class="since">'+since+'</span>':'')+'</div></div>';
  return '<article class="ocard"><div class="oc-top"><span class="mono ono">'+esc(o.orderNo)+'</span>'+
    '<span class="pill '+(del?'ok':'warn')+'">'+(del?'ส่งมอบเรียบร้อย':'ขั้นที่ '+st+' จาก 7')+'</span></div>'+

async function addUser(e){

function pwModal(forced){
  openModal('<form id="pwf" novalidate><h2>เปลี่ยนรหัสผ่าน</h2><p class="hint" style="margin-bottom:14px">'+(forced?'บัญชีนี้ยังใช้รหัสผ่านเริ่มต้น แนะนำให้ตั้งรหัสผ่านใหม่เพื่อความปลอดภัย (จะเตือนทุกครั้งที่เข้าสู่ระบบจนกว่าจะเปลี่ยน) ':'')+'รหัสผ่านต้องมี 8 ตัวอักษร</p>'+
    '<div class="fld"><label for="pw0">รหัสผ่านปัจจุบัน</label><input class="inp mono" id="pw0" type="password" maxlength="8" autocomplete="current-password"></div>'+
    '<div class="fld"><label for="pw1">รหัสผ่านใหม่</label><input class="inp mono" id="pw1" type="password" maxlength="8" autocomplete="new-password"></div>'+
    '<div class="fld"><label for="pw2">ยืนยันรหัสผ่านใหม่</label><input class="inp mono" id="pw2" type="password" maxlength="8" autocomplete="new-password"></div>'+
    '<p class="err" id="pw-err" role="alert"></p><div class="acts"><button type="button" class="btn" id="pw-cancel">'+(forced?'ไว้ทีหลัง':'ยกเลิก')+'</button><button class="btn primary" type="submit" id="pw-go">เปลี่ยนรหัสผ่าน</button></div></form>',function(m){

/* desk events */
function initDeskEvents(){
  var root=$('#v-staff');
  root.addEventListener('click',async function(e){
    var t=e.target.closest('[data-tab]');
    if(t){S.tab=t.dataset.tab;mountTab();return;}
    var b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;
    var a=b.dataset.act,id=b.dataset.id;
    var ord=id&&S.orders.filter(function(o){return o.orderNo===id;})[0];
    if(a==='logout')logout();
    else if(a==='pw')pwModal(false);
    else if(a==='new'){if(!S.depts.length){toast('ยังไม่มีแผนก เพิ่มแผนกที่แท็บ “แผนก” ก่อน',true);return;}orderModal();}
    else if(a==='pipe'){of.status=b.dataset.s;renderOrders();}
    else if(a==='edit'&&ord)orderModal(ord);
    else if(a==='del'){delOrder=id;renderOrders();}
    else if(a==='delno'){delOrder=null;renderOrders();}
    else if(a==='delgo'&&ord){try{await act('deleteOrder',id);delOrder=null;toast('ลบรายการแล้ว');}catch(ex){fail(ex);}}
    else if(a==='dedit'){var d=S.depts.filter(function(x){return x.id===id;})[0];if(d)deptModal(d);}
    else if(a==='ddel'){delDept=id;renderDepts();}
    else if(a==='ddelno'){delDept=null;renderDepts();}
    else if(a==='ddelgo'){try{await act('deleteDept',id);delDept=null;toast('ลบแผนกแล้ว');}catch(ex){fail(ex);}}
    else if(a==='rs'){resetUser=id;delUser=null;renderUsers();}
    else if(a==='rsno'){resetUser=null;renderUsers();}
    else if(a==='udel'){delUser=id;resetUser=null;renderUsers();}
    else if(a==='udelno'){delUser=null;renderUsers();}
    else if(a==='udelgo'){try{await act('deleteUser',id);delUser=null;toast('ลบผู้ใช้แล้ว');}catch(ex){fail(ex);}}
  });
  root.addEventListener('change',async function(e){
    var s=e.target.closest('select[data-act="status"]');if(!s)return;
    var o=S.orders.filter(function(x){return x.orderNo===s.dataset.id;})[0],v=parseInt(s.value,10);
    if(!o||o.status===v)return;
    s.disabled=true;
    try{await act('setStatus',o.orderNo,v);toast('อัปเดตสถานะเป็น “'+stepName(v)+'”');}
    catch(ex){fail(ex);if($('#olist'))renderOrders();}
  });
  root.addEventListener('submit',function(e){
    var f=e.target.closest('form[data-form="reset"]');
    if(f){e.preventDefault();resetPw(f.dataset.id,f.querySelector('input').value);}
  });
}

/* ---------- dashboard ---------- */
var TH_MONTHS=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
var TH_ABBR=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
var ymFmt=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit'});
function ymOf(ts){var y=0,m=0;ymFmt.formatToParts(new Date(ts)).forEach(function(x){if(x.type==='year')y=+x.value;if(x.type==='month')m=+x.value;});return {y:y,m:m};}
var nowYM=ymOf(Date.now());
var D={mode:'month',year:nowYM.y,month:nowYM.m,metric:'qty',mounted:false};
function nf(n){return Number(n).toLocaleString('th-TH',{maximumFractionDigits:1});}
function dashOrders(){
  return S.orders.filter(function(o){
    if(D.mode==='all')return true;
    var t=ymOf(o.createdAt);
    if(t.y!==D.year)return false;
    return D.mode==='year'||t.m===D.month;
  });
}
function dv(o){return D.metric==='qty'?(Number(o.qty)||0):1;}
function mountDash(){
  var el=$('#v-dash');
  el.innerHTML='<div class="dhead"><div><h2>Dashboard</h2><p id="d-period"></p></div><div class="dctl">'+
    '<div class="seg" id="d-mode" role="group" aria-label="ช่วงเวลา"><button type="button" data-m="month">รายเดือน</button><button type="button" data-m="year">รายปี</button><button type="button" data-m="all">ทั้งหมด</button></div>'+
    '<select class="inp" id="d-month" aria-label="เดือน">'+TH_MONTHS.map(function(n,i){return '<option value="'+(i+1)+'">'+n+'</option>';}).join('')+'</select>'+
    '<select class="inp" id="d-year" aria-label="ปี"></select>'+
    '<div class="seg" id="d-metric" role="group" aria-label="นับตาม"><button type="button" data-v="qty">นับเป็นจำนวนเครื่อง</button><button type="button" data-v="orders">นับเป็นรายการ</button></div>'+
    '</div></div><div id="d-body"></div>';
  $('#d-mode').addEventListener('click',function(e){var b=e.target.closest('[data-m]');if(b){D.mode=b.dataset.m;renderDash();}});
  $('#d-metric').addEventListener('click',function(e){var b=e.target.closest('[data-v]');if(b){D.metric=b.dataset.v;renderDash();}});
  $('#d-month').addEventListener('change',function(e){D.month=+e.target.value;renderDash();});
  $('#d-year').addEventListener('change',function(e){D.year=+e.target.value;renderDash();});
  D.mounted=true;
}
function hbarRow(name,cls,v,max,other,label){
  var w=max>0?Math.max(v>0?3:0,v/max*100):0;
  return '<div class="hbar '+cls+'"><div class="nm">'+esc(name)+'</div><div class="tr"><div class="fl" style="width:'+w+'%"></div></div><div class="vl">'+nf(v)+' <i>'+esc(label)+'</i></div></div>';
}
function renderDash(){
  if(!D.mounted)mountDash();
  // year options from data
  var years={};years[nowYM.y]=1;S.orders.forEach(function(o){years[ymOf(o.createdAt).y]=1;});
  var ys=Object.keys(years).map(Number).sort(function(a,b){return b-a;});
  if(ys.indexOf(D.year)<0)D.year=ys[0];
  $('#d-year').innerHTML=ys.map(function(y){return '<option value="'+y+'">'+(y+543)+'</option>';}).join('');
  $('#d-year').value=D.year;$('#d-month').value=D.month;
  $('#d-month').disabled=D.mode!=='month';$('#d-year').disabled=D.mode==='all';
  $('#d-mode').querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.m===D.mode);});
  $('#d-metric').querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.v===D.metric);});
  var period=D.mode==='month'?TH_MONTHS[D.month-1]+' '+(D.year+543):D.mode==='year'?'ปี '+(D.year+543):'ตั้งแต่เริ่มใช้ระบบ';
  $('#d-period').textContent='ช่วงที่เลือก: '+period+' (นับตามวันที่ยื่นเรื่อง)';
  var body=$('#d-body');
  if(!S.ready){body.innerHTML='<div class="empty"><b>กำลังโหลดข้อมูล…</b></div>';return;}
  var list=dashOrders();
  if(!list.length){body.innerHTML='<div class="empty"><b>ยังไม่มีรายการในช่วงนี้</b>ลองเปลี่ยนเดือน ปี หรือเลือก “ทั้งหมด”</div>';return;}
  var unitLabel=D.metric==='qty'?'เครื่อง':'รายการ';
  var totQty=0,done=0,days=[],byStep=[],i;
  for(i=0;i<8;i++)byStep.push(0);
  list.forEach(function(o){
    totQty+=Number(o.qty)||0;byStep[(o.status||1)-1]+=dv(o);
    if(o.status>=8){done++;var d8=(o.stepDates||{})['8'];if(d8)days.push((d8-o.createdAt)/86400000);}
  });
  var inprog=list.length-done,avg=days.length?days.reduce(function(a,b){return a+b;},0)/days.length:null;
  var kpi='<div class="kpis">'+
    '<div class="kpi hi"><div class="kn">'+nf(list.length)+'</div><div class="kl">รายการสั่งซื้อทั้งหมด</div></div>'+
    '<div class="kpi hi"><div class="kn">'+nf(totQty)+'</div><div class="kl">จำนวนรวมที่ขอ</div><small>รวมทุกหน่วยนับ</small></div>'+
    '<div class="kpi"><div class="kn">'+nf(done)+'</div><div class="kl">ส่งมอบแล้ว</div><small>'+nf(done/list.length*100)+'% ของรายการ</small></div>'+
    '<div class="kpi red"><div class="kn">'+nf(inprog)+'</div><div class="kl">กำลังดำเนินการ</div></div>'+
    '<div class="kpi"><div class="kn">'+(avg===null?'–':nf(avg))+'</div><div class="kl">วันเฉลี่ยจนส่งมอบ</div><small>'+(avg===null?'ยังไม่มีรายการที่ส่งมอบ':'จากวันที่ยื่นเรื่อง')+'</small></div></div>';
  // steps
  var maxStep=Math.max.apply(null,byStep);
  var steps='<div class="panel"><h3>อยู่ที่ขั้นตอนไหนบ้าง</h3><p class="sub">หน่วย: '+unitLabel+'</p>'+STEPS.map(function(s,k){
    return hbarRow(s.n+'. '+s.t,s.n===8?'fin':'',byStep[k],maxStep,'',unitLabel);}).join('')+'</div>';
  // departments x steps
  var dm={};
  list.forEach(function(o){
    var k=o.deptId,r=dm[k]||(dm[k]={name:deptName(o)||'-',tot:0,c:[0,0,0,0,0,0,0,0]});
    r.tot+=dv(o);r.c[(o.status||1)-1]+=dv(o);
  });
  var drows=Object.keys(dm).map(function(k){return dm[k];}).sort(function(a,b){return b.tot-a.tot||String(a.name).localeCompare(String(b.name),'th');});
  var maxCell=0;drows.forEach(function(r){r.c.forEach(function(v){if(v>maxCell)maxCell=v;});});
  var colTot=[0,0,0,0,0,0,0,0],grand=0;
  var mtx='<div class="panel"><h3>แยกตามแผนกและขั้นตอน</h3><p class="sub">หน่วย: '+unitLabel+' · เรียงตามแผนกที่สั่งมากที่สุด · '+drows.length+' แผนก</p><div class="mtx-wrap"><table class="mtx"><thead><tr><th>แผนก</th><th>รวม</th>'+
    STEPS.map(function(s){return '<th title="'+esc(s.t)+'">'+s.n+'.<br>'+esc(s.short)+'</th>';}).join('')+'</tr></thead><tbody>'+
    drows.map(function(r){
      grand+=r.tot;
      return '<tr><td>'+esc(r.name)+'</td><td class="tot">'+nf(r.tot)+'</td>'+r.c.map(function(v,k){
        colTot[k]+=v;
        return v?'<td style="background:color-mix(in srgb,'+(k===7?'var(--ok)':'var(--brand)')+' '+Math.round(12+48*v/maxCell)+'%,transparent)">'+nf(v)+'</td>':'<td class="z">·</td>';}).join('')+'</tr>';
    }).join('')+'</tbody><tfoot><tr><td>รวมทั้งหมด</td><td>'+nf(grand)+'</td>'+colTot.map(function(v){return '<td>'+(v?nf(v):'·')+'</td>';}).join('')+'</tr></tfoot></table></div></div>';
  // trend
  var trend='';
  if(D.mode!=='month'){
    var cols=[],tmax=0;
    if(D.mode==='year'){for(i=1;i<=12;i++)cols.push({k:i,l:TH_ABBR[i-1],v:0,now:D.year===nowYM.y&&i===nowYM.m});}
    else{var yy={};list.forEach(function(o){yy[ymOf(o.createdAt).y]=1;});Object.keys(yy).map(Number).sort().forEach(function(y){cols.push({k:y,l:String(y+543),v:0,now:y===nowYM.y});});}
    list.forEach(function(o){var t=ymOf(o.createdAt),key=D.mode==='year'?t.m:t.y;cols.forEach(function(c){if(c.k===key)c.v+=dv(o);});});
    cols.forEach(function(c){if(c.v>tmax)tmax=c.v;});
    trend='<div class="panel"><h3>'+(D.mode==='year'?'แนวโน้มรายเดือน':'แนวโน้มรายปี')+'</h3><p class="sub">หน่วย: '+unitLabel+' · จำนวนที่ยื่นเรื่องในแต่ละ'+(D.mode==='year'?'เดือน':'ปี')+'</p><div class="trend">'+
      cols.map(function(c){var hgt=tmax?c.v/tmax*100:0;
        return '<div class="tcol"><div class="tplot"><div class="tbar'+(c.now?' now':'')+'" style="height:'+(c.v?Math.max(hgt,3):0)+'%">'+(c.v?'<span>'+nf(c.v)+'</span>':'')+'</div></div><small>'+esc(c.l)+'</small></div>';}).join('')+'</div></div>';
  }
  // long waiting
  var late=list.filter(function(o){return o.status<8;}).map(function(o){
    var since=(o.stepDates||{})[o.status]||o.createdAt;return {o:o,d:Math.max(0,Math.floor((Date.now()-since)/86400000))};
  }).sort(function(a,b){return b.d-a.d;}).slice(0,8);
  var lateHtml='<div class="panel"><h3>รายการที่ค้างอยู่ขั้นเดิมนานที่สุด</h3><p class="sub">นับจากวันที่เข้าสู่ขั้นตอนปัจจุบัน · แสดงสูงสุด 8 รายการ</p>'+
    (late.length?late.map(function(x){
      return '<div class="late"><span class="mono">'+esc(x.o.orderNo)+'</span><div class="it"><b>'+esc(x.o.item)+'</b><small>'+esc(deptName(x.o))+' · '+esc(x.o.qty)+' '+esc(x.o.unit)+' · ขั้นที่ '+x.o.status+' '+esc(stepName(x.o.status))+'</small></div><span class="pill '+(x.d>=30?'warn':'brand')+'">'+x.d+' วัน</span></div>';}).join('')
      :'<p class="muted">ไม่มีรายการค้าง ส่งมอบครบทุกรายการแล้ว</p>')+'</div>';
  body.innerHTML=kpi+'<div class="dgrid">'+steps+(trend||lateHtml)+'</div>'+(trend?lateHtml:'')+mtx;
}

/* ---------- navigation ---------- */
function go(v){
  view=(v==='staff'||v==='dash')?v:'status';
  $('#v-status').hidden=view!=='status';$('#v-dash').hidden=view!=='dash';$('#v-staff').hidden=view!=='staff';
  $('#nav-status').setAttribute('aria-pressed',view==='status');$('#nav-dash').setAttribute('aria-pressed',view==='dash');$('#nav-staff').setAttribute('aria-pressed',view==='staff');
  if(view==='staff')renderStaff();
  if(view==='dash')renderDash();
  if(S.ready)refreshAll().catch(function(){});
}
$('#nav-status').addEventListener('click',function(){go('status');});
$('#nav-dash').addEventListener('click',function(){go('dash');});
$('#nav-staff').addEventListener('click',function(){go('staff');});

/* ---------- boot ---------- */
initStatus();initDeskEvents();go(START_VIEW);
(async function(){
  var slow=setTimeout(function(){if(!S.ready){S.slow=true;renderStatusList();}},12000);
  var tk=ssGet('ch9proc.token');
  var pending=[];
  if(tk){
    pending.push(api('session',tk).then(function(r){
      if(r&&r.ok){S.me=r.user;S.token=tk;if(view==='staff'){renderStaff();if(S.me.mustChange)pwModal(true);}return loadStaff();}
      ssSet('ch9proc.token',null);
    }).catch(function(){}));
  }
  try{await loadPublic();}catch(e){console.error(e);S.err=e.message;S.slow=true;renderStatusList();}
  clearTimeout(slow);
  setInterval(function(){if(document.hidden)return;refreshAll().catch(function(){});},30000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)refreshAll().catch(function(){});});
})();
})();

</script>
